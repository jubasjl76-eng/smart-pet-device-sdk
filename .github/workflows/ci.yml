name: CI
on:
  push:
    branches: [main, development]
  pull_request:
jobs:
  ci:
    uses: jubasjl76-eng/smart-pet-ci/.github/workflows/pio-ci.yml@main
    with:
      # example-dir makes each env build examples/<env> (not always the feeder)
      example-dir: examples
      environments: '["feeder","door","scale","audio"]'
      native-test-command: "pio test -e native -e native-san"
