name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  native:
    name: native logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test/run_native.sh

  device:
    name: pio run (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [feeder, door, scale]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'library.json') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install --upgrade platformio
      - run: pio run -e ${{ matrix.env }}
