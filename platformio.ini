; smart-pet-device-sdk — library + examples + native tests
;
;   pio test -e native            # freestanding logic (topics/schedule/backoff/journal)
;   pio run  -e feeder            # build the feeder example
;
[platformio]
src_dir = examples/feeder
lib_dir = .

[env]
build_flags = -Wall

[env:native]
platform = native
test_framework = custom
build_flags = -std=c++17 -Wall -Wextra
; `pio test -e native` compiles test/test_native/test_main.cpp; it has its own main().

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8
    bogde/HX711 @ ^0.7.5
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DMQTT_MAX_PACKET_SIZE=1024

[env:feeder]
extends = esp32_base
build_src_filter = +<*> +<../../src/>
build_flags = ${esp32_base.build_flags} -DSPD_MODULE_FEEDER

[env:door]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DSPD_MODULE_DOOR

[env:scale]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DSPD_MODULE_SCALE
