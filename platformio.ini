; smart-pet-device-sdk — library + examples + native tests
;
;   ./test/run_native.sh          # freestanding logic — no toolchain
;   pio test -e native            # same, via PlatformIO
;   pio run  -e feeder            # build the feeder example (src_dir default below)
;   PLATFORMIO_SRC_DIR=examples/door pio run -e door    # build another example
;
; PlatformIO wants src_dir to BE the sketch folder. CI passes example-dir:examples
; to smart-pet-ci/pio-ci, which sets PLATFORMIO_SRC_DIR=examples/<env> per job.
; Locally, `pio run -e feeder` uses the default below; for the others set
; PLATFORMIO_SRC_DIR as shown.
;
[platformio]
src_dir = examples/feeder
lib_dir = .

[env]
build_flags = -Wall

; Host unit tests (GoogleTest). `pio test -e native` compiles every
; test/test_native/*.cpp; PlatformIO fetches googletest and provides main().
[native_base]
platform = native
test_framework = googletest
lib_deps = google/googletest@^1.15.2
build_src_filter = -<*>
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -lpthread

[env:native]
extends = native_base

; Same tests under AddressSanitizer + UBSan.
[env:native-san]
extends = native_base
build_flags = ${native_base.build_flags} -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
build_unflags = -O2

; Same tests with gcov instrumentation; CI runs gcovr afterwards.
[env:native-cov]
extends = native_base
build_flags = ${native_base.build_flags} -O0 -g --coverage
build_unflags = -O2

[esp32_base]
platform = espressif32 @ ^6.9.0   ; ESP32 Arduino core 3.x — PresenceScanner targets it
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; BLE (door) + WiFi + MQTT + audio overflow the default ~1.3 MB app partition;
; min_spiffs gives two ~1.9 MB app slots (also the room signed A/B OTA needs).
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8
    bogde/HX711 @ ^0.7.5
    madhephaestus/ESP32Servo @ ^3.0.5
; the SDK headers live in ../../src relative to any examples/<board> sketch dir
build_src_filter = +<*> +<../../src/>
; ESP32 Arduino core 2.x defaults to gnu++11/14; the SDK headers are C++17
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -DMQTT_MAX_PACKET_SIZE=1024
    -I src

[env:feeder]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DSPD_MODULE_FEEDER

[env:door]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DSPD_MODULE_DOOR

[env:scale]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DSPD_MODULE_SCALE

[env:audio]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DSPD_MODULE_AUDIO
