; smart-pet-device-sdk — library + examples + native tests
;
;   ./test/run_native.sh          # freestanding logic — no toolchain
;   pio test -e native            # same, via PlatformIO
;   pio run  -e feeder|door|scale # build one example for esp32dev
;
; src_dir points at examples/; each device env picks its own sub-folder with
; build_src_filter, so `pio run -e door` builds examples/door (not the feeder).
;
[platformio]
src_dir = examples
lib_dir = .

[env]
build_flags = -Wall

[env:native]
platform = native
test_framework = custom
build_src_filter = -<*>
build_flags = -std=c++17 -Wall -Wextra
; `pio test -e native` compiles test/test_native/test_main.cpp; it has its own main().

[esp32_base]
platform = espressif32 @ ^6.9.0   ; ESP32 Arduino core 3.x — PresenceScanner targets it
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8
    bogde/HX711 @ ^0.7.5
    madhephaestus/ESP32Servo @ ^3.0.5
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DMQTT_MAX_PACKET_SIZE=1024

[env:feeder]
extends = esp32_base
build_src_filter = -<*> +<feeder/>
build_flags = ${esp32_base.build_flags} -DSPD_MODULE_FEEDER

[env:door]
extends = esp32_base
build_src_filter = -<*> +<door/>
build_flags = ${esp32_base.build_flags} -DSPD_MODULE_DOOR

[env:scale]
extends = esp32_base
build_src_filter = -<*> +<scale/>
build_flags = ${esp32_base.build_flags} -DSPD_MODULE_SCALE
